---
name: CI Symfony

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - '**'
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    name: TestsBackend CI
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: ci_secret
      DATABASE_URL: mysql://app:masha@database:3306/kalinka_db?serverVersion=8.0.32&charset=utf8mb4
      APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Start database service
        run: docker compose up -d database

      - name: Wait for database health
        run: |
          container_id=$(docker compose ps -q database)
          if [ -z "$container_id" ]; then
            echo "Database container was not created"
            docker compose ps
            exit 1
          fi

          for i in {1..60}; do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")
            if [ "$status" = "healthy" ]; then
              echo "Database is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Database did not become healthy in time"
          docker compose ps
          docker compose logs database --tail=200
          exit 1

      # Installer les dépendances Symfony
      - name: Install Symfony dependencies
        run: docker compose run --rm backend composer install --no-interaction --prefer-dist --no-scripts --no-progress

      - name: Prepare test database
        run: |
          docker compose exec -T database mysql -uroot -pmasha -e "CREATE DATABASE IF NOT EXISTS kalinka_db_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          docker compose exec -T database mysql -uroot -pmasha -e "GRANT ALL PRIVILEGES ON kalinka_db_test.* TO 'app'@'%'; FLUSH PRIVILEGES;"

      - name: Database smoke check
        run: docker compose run --rm backend php bin/console dbal:run-sql "SELECT 1"

      - name: Run migrations
        run: docker compose run --rm backend php bin/console doctrine:migrations:migrate --no-interaction

      - name: Doctrine schema validate
        run: docker compose run --rm backend php bin/console doctrine:schema:validate --skip-sync

      # Lancer PHPUnit
      - name: Run PHPUnit tests
        run: docker compose run --rm backend php /app/bin/phpunit tests/Entity

      # PHPStan code quality
      - name: PHPStan code quality
        run: docker compose run --rm backend sh -lc 'if [ -x vendor/bin/phpstan ]; then vendor/bin/phpstan analyse || true; else echo "PHPStan non installé, skip"; fi'

      - name: Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs backend --tail=200 || true
          docker compose logs database --tail=200 || true
